version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fincoach-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fincoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fincoach-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/fincoach?schema=public"
      JWT_SECRET: "fintech-ai-coach-super-secure-jwt-secret-key-upay-2026"
      JWT_REFRESH_SECRET: "fintech-ai-coach-super-secure-refresh-secret-upay-2026"
      CLIENT_URL: "http://localhost:5173"
      AI_PROVIDER: "fallback"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fincoach-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
